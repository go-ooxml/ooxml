name: CI

on:
  push:
    branches: [main]
  pull_request:

env:
  GOWORK: "off"

jobs:
  test:
    runs-on: ubuntu-latest
    # The race detector needs cgo at test time; the library itself stays
    # CGO-free, which the cross-build job proves with CGO_ENABLED=0.
    env:
      CGO_ENABLED: "1"
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-go@v7
        with:
          go-version: "1.27.2"
      - name: Gofmt
        run: |
          out=$(gofmt -l .)
          if [ -n "$out" ]; then
            echo "gofmt needs to be run on:"
            echo "$out"
            exit 1
          fi
      - name: Vet
        run: CGO_ENABLED=0 go vet ./...
      - name: Test with coverage (race)
        run: go test -race -covermode=atomic -coverprofile=cover.out ./...
      # ⛔ EXACT, not the total line. `go tool cover -func` prints one
      # decimal, so a single uncovered statement out of two thousand
      # rounds to "100.0%" and a gate reading that total passes. This
      # reads the PROFILE: a block whose execution count is zero fails,
      # however small a share of the whole it is.
      - name: Enforce 100% coverage, exactly
        run: |
          go tool cover -func=cover.out
          uncovered=$(awk 'NR>1 && $3==0' cover.out || true)
          if [ -n "$uncovered" ]; then
            echo "::error::these blocks are never executed"
            echo "$uncovered"
            exit 1
          fi
          below=$(go tool cover -func=cover.out | awk '$3 != "100.0%"' | grep -v "^total:" || true)
          if [ -n "$below" ]; then
            echo "::error::these functions are below 100%"
            echo "$below"
            exit 1
          fi

  cross-build:
    runs-on: ubuntu-latest
    env:
      CGO_ENABLED: "0"
    strategy:
      fail-fast: false
      matrix:
        target:
          - linux/amd64
          - linux/arm64
          - linux/riscv64
          - linux/ppc64le
          - linux/s390x
          - linux/loong64
          - darwin/amd64
          - darwin/arm64
          - windows/amd64
          - js/wasm
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-go@v7
        with:
          go-version: "1.27.2"
      - name: Build ${{ matrix.target }}
        run: |
          export GOOS=$(echo "${{ matrix.target }}" | cut -d/ -f1)
          export GOARCH=$(echo "${{ matrix.target }}" | cut -d/ -f2)
          go build ./...

  # ⛔ CROSS-BUILDING IS NOT RUNNING. The job above proves this package
  # compiles for s390x; it says nothing about what it does when the byte order
  # differs. The landing claimed "the tests run on six architectures" while
  # they ran on one, which is what made this lane necessary rather than nice.
  #
  # The pattern is go-pdfkit's: qemu-user-static plus `go test -exec=`, which
  # needs no container and no privileged runner.
  arch-qemu:
    runs-on: ubuntu-latest
    env:
      CGO_ENABLED: "0"
    strategy:
      fail-fast: false
      matrix:
        include:
          - { goarch: riscv64, exec: "-exec=qemu-riscv64-static" }
          - { goarch: loong64, exec: "-exec=qemu-loongarch64-static" }
          - { goarch: ppc64le, exec: "-exec=qemu-ppc64le-static" }
          - { goarch: s390x,   exec: "-exec=qemu-s390x-static" }
          - { goarch: arm64,   exec: "-exec=qemu-aarch64-static" }
          # ⛔ 386 and arm are deliberately absent: qemu-i386 loses the guest's
          # floating-point state across an asynchronous preemption, which makes
          # a flake out of correct code (go-pdfkit measured 5 failures in 8
          # runs there, 0 with asyncpreemptoff=1), and a lane that flakes is a
          # lane people learn to ignore.
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-go@v7
        with:
          go-version: "1.27.2"
      # ⛔ `qemu-user-static` is a VIRTUAL package on Ubuntu 26.04, which
      # `ubuntu-latest` became on 2026-10-19, and apt refuses to choose between its
      # two providers:
      #
      #   E: Package 'qemu-user-static' has no installation candidate
      #
      # ⚠ Installing a provider is NOT the fix: `qemu-user-binfmt` registers binfmt
      # handlers, it does not ship the `qemu-<arch>-static` binaries this lane
      # invokes. `qemu-user` ships the dynamic `qemu-<arch>`, which is all that
      # `go test -exec` needs, so both are installed and BOTH NAMES are accepted
      # below. go-tex/engine#645 has the full account.
      - name: install qemu user-mode emulators
        timeout-minutes: 10
        run: sudo apt-get update && sudo apt-get install -y qemu-user qemu-user-binfmt
      # ⛔ No -race: the detector needs cgo, and cgo needs a cross compiler for
      # the guest. What this lane is for is byte order and word size.
      #
      # ⛔ And no LibreOffice: it is not built for these architectures, and the
      # test that asks it skips when it is absent -- so this lane runs the
      # readers and the writers against their own fixtures, which is what byte
      # order can break.
      - name: Test under qemu (${{ matrix.goarch }})
        run: |
          flag="${{ matrix.exec }}"
          ex=""
          if [ -n "$flag" ]; then
            base="${flag#-exec=}"
            q=""
            for cand in "$base" "${base%-static}"; do
              command -v "$cand" >/dev/null 2>&1 && q="$cand" && break
            done
            # ⛔ A missing emulator FAILS this lane. A lane that reports success
            # for an architecture it never ran is the one outcome this matrix
            # exists to rule out.
            if [ -z "$q" ]; then
              echo "::error::no qemu user emulator for ${{ matrix.goarch }} (looked for $base and ${base%-static})"
              exit 1
            fi
            ex="-exec=$q"
            # Printed on purpose: without it, "ran under emulation" and
            # "skipped" are indistinguishable from a green tick.
            echo "running ${{ matrix.goarch }} under $q"
          else
            # ⚠ An EMPTY exec is a lane that runs NATIVELY on purpose: a 386
            # ELF executes directly on the x86-64 runner, and qemu-i386 was
            # measured to lose the guest's floating-point state across the
            # signal Go delivers for preemption. Failing it for having no
            # emulator would break a lane that is correct as it stands.
            echo "running ${{ matrix.goarch }} natively"
          fi
          GOARCH=${{ matrix.goarch }} go test $ex ./...
